name: Build Windows app
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows app
        run: dotnet publish .\FolderStickerPrinter\FolderStickerPrinter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - uses: actions/upload-artifact@v4
        with:
          name: FolderStickerPrinter-win-x64
          path: FolderStickerPrinter\bin\Release\net8.0-windows\win-x64\publish\

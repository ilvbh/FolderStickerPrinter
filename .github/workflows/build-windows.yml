
name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows app
        run: dotnet publish ./FolderStickerPrinter/FolderStickerPrinter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: FolderStickerPrinter-Windows
          path: ./publish/
          if-no-files-found: error
